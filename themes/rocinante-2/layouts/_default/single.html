{{ define "main" }}

    <div class="post h-entry">
        <data class="u-url" value="{{ .Permalink }}" hidden></data>
        {{- partial "author-hcard.html" . }}
        <div class="title-group">
            <div class="title">
                <h1 class="p-name">{{ .Title }}</h1>
            </div>
            <div class="date"><h5><time class="dt-published" datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Params.date.Format "Jan 02, 2006" }}</time></h5></div>
        </div>
        <article class="content e-content">
            {{ .Content }}
        </article>
        {{ with .Params.tags }}
        <br>
            <div class="tags">
                <div class="horizontal-links links">
                    {{ range . }}{{ with $.Site.GetPage (printf "/tags/%s" ( . | urlize)) }}<a href="{{ .RelPermalink }}">#<span class="p-category">{{ .Name }}</span></a>{{ end }}{{ end }}
                </div>
            </div>
        {{ end }}
    </div>

{{ end }}
